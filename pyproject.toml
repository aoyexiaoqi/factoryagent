[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "factoryagent"
version = "0.1.0"
description = "Offline manufacturing-engineering AI agent workbench with controlled, allowlisted tools"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "aoyexiaoqi"}]
keywords = ["manufacturing", "agent", "ie", "industrial-engineering", "offline", "pareto"]
dependencies = [
    "fastapi>=0.100",
    "pydantic>=2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "httpx>=0.24"]
serve = ["uvicorn>=0.23"]

[project.scripts]
factoryagent = "factoryagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["factoryagent"]
